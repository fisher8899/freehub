<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeHub · 免费 Token 情报站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-egg">🥚</span>
    <div>
      <h1>FreeHub <small>免费 Token 情报站</small></h1>
      <p class="tagline">聚合各大 AI 厂商送 Token / 免费用模型的福利活动</p>
    </div>
  </div>
  <div class="topbar-actions">
    <div id="stats" class="stats">加载中…</div>
    <button id="btn-crawl" class="btn btn-primary" title="立即拉取全部启用源">⟳ 立即刷新</button>
    <button id="btn-manage" class="btn btn-ghost" title="管理数据源 / 手动添加">⚙ 管理</button>
  </div>
</header>

<nav class="filters">
  <input id="f-q" type="search" placeholder="搜索厂商 / 活动 / 模型…">
  <div class="chip-row" id="f-type">
    <button data-v="" class="chip active">全部</button>
    <button data-v="signup" class="chip">🎁 注册送</button>
    <button data-v="daily" class="chip">📅 每日打卡</button>
    <button data-v="login" class="chip">👉 登录即领</button>
    <button data-v="limited" class="chip">⏳ 限时体验</button>
    <button data-v="free" class="chip">🆓 长期免费</button>
  </div>
  <div class="chip-row" id="f-tier">
    <button data-v="" class="chip active">所有等级</button>
    <button data-v="gold" class="chip gold">🥇 金蛋</button>
    <button data-v="silver" class="chip silver">🥈 银蛋</button>
    <button data-v="copper" class="chip copper">🥉 铜蛋</button>
  </div>
  <div class="filter-right">
    <label>时间
      <select id="f-window">
        <option value="14" selected>最近 2 周</option>
        <option value="7">最近 7 天</option>
        <option value="30">最近 30 天</option>
        <option value="all">全部</option>
      </select>
    </label>
    <label>排序
      <select id="f-sort">
        <option value="time" selected>最新发现</option>
        <option value="score">福利分</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="f-expired"> 含已过期</label>
  </div>
</nav>

<main id="feed" class="feed"><div class="loading">⏳ 正在加载活动数据…</div></main>

<footer class="foot">
  数据来源：<a href="https://freeegg.top/#/?tier=gold%2Csilver%2Ccopper&duration=limited%2Clongterm" target="_blank" rel="noopener">FreeEgg 赛博鸡蛋</a>
  · 各厂商官网 / 微信公众号 RSS 订阅 · 手动收录 —— 本服务仅聚合公开活动信息，请遵守各平台服务条款。
</footer>

<!-- 管理弹窗 -->
<dialog id="dlg-manage">
  <div class="dlg-head">
    <h2>⚙ 管理</h2>
    <button class="btn btn-ghost dlg-close" onclick="document.getElementById('dlg-manage').close()">✕</button>
  </div>
  <div class="dlg-tabs">
    <button class="tab active" data-tab="sources">数据源</button>
    <button class="tab" data-tab="manual">手动添加活动</button>
  </div>

  <section id="tab-sources" class="tab-pane active">
    <p class="hint">定时采集已在后台运行（<span id="cfg-interval"></span>）。微信公众号内容可通过 RSS 桥接服务（如 wechat2rss.xlab.app）转成 feed 后在此添加。</p>
    <div id="src-list" class="src-list"></div>
    <h3>➕ 添加新源</h3>
    <form id="form-src" class="form-grid">
      <label>类型
        <select name="type">
          <option value="rss">RSS / Atom（公众号桥、博客）</option>
          <option value="github">GitHub 清单（raw README）</option>
          <option value="freeegg">FreeEgg 数据文件</option>
        </select>
      </label>
      <label>名称 <input name="name" placeholder="例如：华为云开发者公众号" required></label>
      <label class="full">Feed 地址 <input name="url" placeholder="https://…" required></label>
      <button class="btn btn-primary full" type="submit">添加并启用</button>
    </form>
  </section>

  <section id="tab-manual" class="tab-pane">
    <p class="hint">看到别的渠道推送的福利活动？手动录入后立即出现在列表里。</p>
    <form id="form-manual" class="form-grid">
      <label>厂商 <input name="vendor" placeholder="例如：华为云" required></label>
      <label>类型
        <select name="type">
          <option value="">自动识别</option>
          <option value="signup">注册送</option>
          <option value="daily">每日打卡送</option>
          <option value="login">登录即领</option>
          <option value="limited">限时体验</option>
          <option value="free">长期免费</option>
        </select>
      </label>
      <label class="full">标题 <input name="title" placeholder="例如：ModelArts Studio 免费领 200 万 Token" required></label>
      <label class="full">一句话摘要 <input name="summary" placeholder="活动内容、额度、条件…"></label>
      <label class="full">领取攻略（支持 markdown）<textarea name="content" rows="5" placeholder="1. 注册…&#10;2. 登录后在…领取"></textarea></label>
      <label>活动链接 <input name="link" placeholder="https://…"></label>
      <label>截止日期 <input name="expiresAt" type="date"></label>
      <button class="btn btn-primary full" type="submit">收录</button>
    </form>
  </section>
</dialog>

<script src="/app.js"></script>
</body>
</html>
